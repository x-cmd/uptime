# data/index.yml — curated catalog of provider status pages.
#
# Schema:
#   Top-level keys = categories (cloud, ai, other, ...)
#   Each value = a list of providers in that category
#   Each provider has:
#     name        (required) — slug-style display name, lowercase
#     homepage    (required) — vendor's main website
#     statuspage  (required) — vendor's public human-readable status page
#     api_type    (required) — atlassian-statuspage | custom-json | statuspal | rss
#     api_url     (required) — machine-readable status JSON endpoint
#     region      (optional) — cn | global; used by future x-cmd.com/uptime filters
#
# To add a provider, append one entry under the right category and open a PR.
# CI runs .x-cmd/build-index-tsv.py to regenerate data/index.tsv.
#
# api_urls are best-effort — if you find one has changed, please update it
# (or open an issue).

cloud:
  - name: aliyun
    homepage: https://www.aliyun.com
    statuspage: https://status.aliyun.com
    api_type: custom-json
    api_url: https://status.aliyun.com/api/v1/status
    region: cn
