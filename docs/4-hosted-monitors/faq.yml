id: x-uptime-4-hosted-monitors

data:
  - name:
      en: "UptimeRobot"
      cn: "UptimeRobot"
    qa:
      - id: uptimerobot-free-limits
        question:
          en: "What does UptimeRobot's free tier actually give me?"
          cn: "UptimeRobot 免费版具体给什么?"
        answer:
          en: "50 monitors at a 5-minute interval — HTTP(S), ping, port, and keyword checks. Email and a small set of webhooks are included. The bottleneck for most free users is the 5-minute granularity, not the monitor count. A failure is detected in 0-5 minutes."
          cn: "50 个监控、5 分钟间隔 —— HTTP(S)、ping、port、keyword 检查。邮件和少量 webhook 含。多数免费用户的瓶颈是 5 分钟粒度,不是监控数。故障 0-5 分钟才会被检测。"
        confidence: 9
        reference:
          - docs/4-hosted-monitors/en.md

      - id: uptimerobot-pro-vs-free
        question:
          en: "What does UptimeRobot Pro add over the free tier?"
          cn: "UptimeRobot Pro 在免费版基础上加了什么?"
        answer:
          en: "Pro (~$7/mo at time of writing): 1-minute check interval, more monitors, SMS alerts, multiple status pages. Higher tiers add team features, incident management, and SLA reporting."
          cn: "Pro(2026 年约 $7/mo):1 分钟检查间隔、更多监控、短信告警、多个状态页。再上一档加团队功能、事故管理、SLA 报告。"
        confidence: 9
        reference:
          - docs/4-hosted-monitors/en.md

  - name:
      en: "Better Stack"
      cn: "Better Stack"
    qa:
      - id: better-stack-differentiator
        question:
          en: "What makes Better Stack different from UptimeRobot?"
          cn: "Better Stack 相比 UptimeRobot 有什么不同?"
        answer:
          en: "Status page editor (incidents can be posted manually, auto-detected from uptime failures, or both), 30-second intervals on the cheapest paid tier, JSON-path and SSL-expiry checks, and a built-in on-call product. The status page is part of the product surface, not a side artifact."
          cn: "状态页编辑器(事故可手动发布、可从 uptime 故障自动检测、可两者兼有)、最便宜付费档 30 秒间隔、JSON-path 和 SSL 到期检查、内置 on-call 产品。状态页是产品表面的一部分,不是附属品。"
        confidence: 9
        reference:
          - docs/4-hosted-monitors/en.md

      - id: better-stack-pricing
        question:
          en: "What does Better Stack cost for a small team?"
          cn: "Better Stack 小团队档位多少钱?"
        answer:
          en: "Free for the first monitor (1-minute interval) plus a status page. Starter tier is around $25/mo at time of writing for a small team with multiple status pages and richer alert routing. Enterprise scales to hundreds of monitors with SOC 2, audit logs, and SSO."
          cn: "免费:第一个监控(1 分钟间隔)+ 一个状态页。Starter 档:小团队 2026 年约 $25/mo,多个状态页、更丰富的告警路由。Enterprise 规模到几百个监控,带 SOC 2、审计日志、SSO。"
        confidence: 9
        reference:
          - docs/4-hosted-monitors/en.md

  - name:
      en: "Better Uptime"
      cn: "Better Uptime"
    qa:
      - id: better-uptime-vs-better-stack
        question:
          en: "How is Better Uptime different from Better Stack?"
          cn: "Better Uptime 和 Better Stack 有什么不同?"
        answer:
          en: "Both ship uptime + status page + on-call. Better Uptime's differentiator is the incident-management workflow: Sentry-like postmortem templates, status updates, retros. If your team already uses PagerDuty and only needs uptime, Better Uptime is overkill. If you want one vendor for monitoring + status + on-call + postmortems, Better Uptime is more opinionated."
          cn: "两家都做 uptime + 状态页 + on-call。Better Uptime 的差异化是事故管理工作流:Sentry 风格的复盘模板、状态更新、retros。如果团队已经在用 PagerDuty,只需要 uptime,Better Uptime 过重。想一家供应商搞定监控 + 状态 + on-call + 复盘,Better Uptime 意见更明确。"
        confidence: 9
        reference:
          - docs/4-hosted-monitors/en.md

  - name:
      en: "Hyperping"
      cn: "Hyperping"
    qa:
      - id: hyperping-when
        question:
          en: "When should I pick Hyperping over the bigger hosted monitors?"
          cn: "什么时候选 Hyperping 而不是更大的托管监控?"
        answer:
          en: "When you're a single developer or a tiny team, want better intervals and nicer status pages than UptimeRobot's free tier, and don't need the incident-management stack of Better Stack / Better Uptime. Hyperping is the right shape for \"monitor a few sites, get nice alerts, ship a status page.\""
          cn: "当你是独立开发者或微型团队,想要比 UptimeRobot 免费版更好的间隔和更好看的状态页,且不需要 Better Stack / Better Uptime 的事故管理栈时。Hyperping 正合\"盯几个站点、拿到好看的告警、上一个状态页\"。"
        confidence: 8
        reference:
          - docs/4-hosted-monitors/en.md

  - name:
      en: "hosted vs self-hosted"
      cn: "托管 vs 自托管"
    qa:
      - id: when-hosted-beats-self-hosted
        question:
          en: "When does hosted beat self-hosted?"
          cn: "什么时候托管胜过自托管?"
        answer:
          en: "When you have no dedicated ops person AND no existing infrastructure to attach a self-hosted monitor to. Hosted is almost always the right answer in that situation. The moment you have either, self-hosted starts to win on cost and data residency."
          cn: "没有专职 ops 也无现成基础设施可以挂自托管监控时。2026 年这种情况几乎总是托管对。一旦两样都有其中一样,自托管开始在成本和数据驻留上胜出。"
        confidence: 9
        reference:
          - docs/4-hosted-monitors/en.md

      - id: hosted-monitor-down-mitigation
        question:
          en: "What do I do if my hosted monitor is itself down?"
          cn: "托管监控本身挂了,怎么办?"
        answer:
          en: "Pair it with an independent GitHub Actions cron that probes the monitor's own status page URL. The status page going red on the GH side tells you the host monitor is itself broken. See `6-github-actions-as-monitor` for the recipe."
          cn: "配一个独立的 GitHub Actions cron,探测监控自家的状态页 URL。状态页在 GH 这边变红,说明托管监控本身坏了。recipe 见 `6-github-actions-as-monitor`。"
        confidence: 9
        reference:
          - docs/6-github-actions-as-monitor/en.md
