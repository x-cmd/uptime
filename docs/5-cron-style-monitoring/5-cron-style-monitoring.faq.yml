id: x-uptime-5-cron-style-monitoring

data:
  - name:
      en: "concepts"
      cn: "概念"
    qa:
      - id: cron-vs-http-monitor
        question:
          en: "What's the difference between a cron-style monitor and an HTTP monitor?"
          cn: "cron 风格监控和 HTTP 监控有什么不同?"
        answer:
          en: "HTTP monitors ping the target and ask \"is it responding?\" Cron-style monitors flip the relationship: the job pings the monitor and asks \"did I run?\" Three failure modes cron-style catches that HTTP doesn't: the job didn't run at all, started but didn't finish, finished but failed."
          cn: "HTTP 监控去 ping 目标,问\"它在响应吗?\"。cron 风格监控翻转关系:任务 ping 监控,问\"我跑了吗?\"。cron 风格能抓三个 HTTP 抓不到的故障:任务根本没跑、开了但没跑完、跑完但失败。"
        confidence: 9
        reference:
          - docs/5-cron-style-monitoring/5-cron-style-monitoring.en.md

      - id: ping-model-endpoints
        question:
          en: "What ping endpoints does Healthchecks.io expose?"
          cn: "Healthchecks.io 提供哪些 ping 端点?"
        answer:
          en: "Three per check: `/start` (the job started), `/` (the job succeeded), `/fail` (the job failed). Each check has a UUID in the URL. The monitor alerts you when an expected `/` ping doesn't arrive within the configured period + grace."
          cn: "每个 check 三个端点:`/start`(任务开始)、/`(任务成功)、`/fail`(任务失败)。每个 check 在 URL 里有一个 UUID。监控在配置的周期 + grace 内没有收到 `/` ping 就告警。"
        confidence: 9
        reference:
          - docs/5-cron-style-monitoring/5-cron-style-monitoring.en.md

  - name:
      en: "Healthchecks.io"
      cn: "Healthchecks.io"
    qa:
      - id: healthchecks-free-tier
        question:
          en: "What does Healthchecks.io give for free?"
          cn: "Healthchecks.io 免费版给什么?"
        answer:
          en: "Open-source projects: 20 checks at any interval, including the OSS self-host option on your own Postgres. Non-OSS projects have a smaller free tier with limited check counts."
          cn: "开源项目:20 个 check,任意间隔,也包含 OSS 自托管选项(自己的 Postgres)。非开源项目免费档更小,check 数有限。"
        confidence: 9
        reference:
          - docs/5-cron-style-monitoring/5-cron-style-monitoring.en.md

      - id: healthchecks-self-host
        question:
          en: "Can I self-host Healthchecks.io?"
          cn: "可以自托管 Healthchecks.io 吗?"
        answer:
          en: "Yes — the backend is open source at https://github.com/healthchecks/healthchecks. It runs on Postgres plus a small Python/Django app. Self-hosting is the right move for keeping monitoring metadata on-prem; expect a few hours to set up if you've never done it."
          cn: "可以 —— 后端是开源的,https://github.com/healthchecks/healthchecks 。跑在 Postgres 加一个小 Python/Django 应用上。自托管是把监控元数据留在本地的正确做法;没部署过的话,几小时能起来。"
        confidence: 9
        reference:
          - docs/5-cron-style-monitoring/5-cron-style-monitoring.en.md

  - name:
      en: "Cronitor"
      cn: "Cronitor"
    qa:
      - id: cronitor-differentiator
        question:
          en: "What's Cronitor's differentiator over Healthchecks.io?"
          cn: "Cronitor 相对 Healthchecks.io 的差异化在哪?"
        answer:
          en: "Schedule parsing (catches impossible cron expressions like \"Feb 30\" at definition time), run-time metrics (did the job run faster/slower than last week? did its log output change shape?), and richer telemetry integrations (Kubernetes CronJobs, ECS, Airflow). Pick Cronitor when you have a fleet of cron entries; for a handful, Healthchecks.io is simpler."
          cn: "Schedule 解析(定义时就检测\"Feb 30\"这类不可能的 cron 表达式)、运行指标(任务比上周跑得快/慢?日志输出形态变了?)、更丰富的 telemetry 集成(Kubernetes CronJob、ECS、Airflow)。有一批 cron 条目时选 Cronitor;几个就 Healthchecks.io 更简单。"
        confidence: 9
        reference:
          - docs/5-cron-style-monitoring/5-cron-style-monitoring.en.md

  - name:
      en: "Dead Man's Snitch"
      cn: "Dead Man's Snitch"
    qa:
      - id: dms-sentry-acquisition
        question:
          en: "What happened to Dead Man's Snitch?"
          cn: "Dead Man's Snitch 后来怎么样了?"
        answer:
          en: "Acquired by Sentry in 2023. Now ships as part of Sentry's Cron Monitoring product. If you're a Sentry customer, you may already have Cron Monitoring enabled — same ping model, integrated with Sentry issues."
          cn: "2023 年被 Sentry 收购。现在作为 Sentry Cron Monitoring 产品的一部分交付。如果你是 Sentry 客户,你可能已经开了 Cron Monitoring —— 同样的 ping 模型,与 Sentry issue 集成。"
        confidence: 9
        reference:
          - docs/5-cron-style-monitoring/5-cron-style-monitoring.en.md

      - id: when-pick-dms
        question:
          en: "When does Dead Man's Snitch (Sentry Cron Monitoring) make sense?"
          cn: "什么时候 Dead Man's Snitch(Sentry Cron Monitoring)是合适的?"
        answer:
          en: "When you're already a Sentry customer and want cron alerts to flow into the same incident pipeline as your application errors. If you're not on Sentry and want a focused cron-monitor vendor, Healthchecks.io is the more obvious choice."
          cn: "已经在用 Sentry,想让 cron 告警和应用错误走同一条事故流水线。不在 Sentry 上、想要专门的 cron 监控供应商,Healthchecks.io 更显然。"
        confidence: 9
        reference:
          - docs/5-cron-style-monitoring/5-cron-style-monitoring.en.md

  - name:
      en: "misuses"
      cn: "误用"
    qa:
      - id: cron-monitor-for-http
        question:
          en: "Can I use a cron-style monitor to check whether an HTTP endpoint is alive?"
          cn: "可以用 cron 风格监控来查 HTTP 端点是不是活着吗?"
        answer:
          en: "No. A cron monitor accepts an external ping and treats it as \"ping arrived\" — but it can't tell you whether the endpoint actually responded. Use UptimeRobot / Uptime Kuma / Prometheus + blackbox_exporter for HTTP probes. Use cron-style only for \"did my scheduled job run?\"."
          cn: "不行。cron 监控接受外部 ping 就当\"ping 到了\" —— 但它没法告诉你端点是不是真的响应了。HTTP 探测用 UptimeRobot / Uptime Kuma / Prometheus + blackbox_exporter。cron 风格只用于\"我的定时任务跑了没?\"。"
        confidence: 9
        reference:
          - docs/5-cron-style-monitoring/5-cron-style-monitoring.en.md
