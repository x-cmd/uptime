id: x-uptime-7-decision-guide

data:
  - name:
      en: "scenarios"
      cn: "场景"
    qa:
      - id: personal-site-pick
        question:
          en: "What monitor fits a personal site?"
          cn: "个人站点用哪个监控?"
        answer:
          en: "UptimeRobot free tier (50 monitors, 5-minute interval). Add a GitHub Actions cron at */15 probing your status page URL as a second layer. Total cost: $0/mo. Don't self-host Kuma for a personal site — operational debt for no benefit."
          cn: "UptimeRobot 免费档(50 监控、5 分钟间隔)。加 GitHub Actions cron `*/15` 探测状态页 URL 当第二层。总成本 $0/mo。不要为个人站点自托管 Kuma —— 没有收益的运维债。"
        confidence: 9
        reference:
          - docs/7-decision-guide/en.md

      - id: saas-paying-users-pick
        question:
          en: "What monitor fits a SaaS with paying users?"
          cn: "有付费用户的 SaaS 用哪个监控?"
        answer:
          en: "Better Stack or Better Uptime — both ship a polished status page, incident posting, and on-call. Pick Better Stack for status-page-first; Better Uptime for incident-management opinionation. Add GH Actions cron at */5 (public) or */15 (private) and Healthchecks.io for nightly jobs. Total cost: $25-70/mo."
          cn: "Better Stack 或 Better Uptime —— 两家都有打磨过的状态页、事故发布、on-call。Better Stack 偏状态页为先,Better Uptime 偏事故管理意见化。加 GH Actions cron `*/5`(公开)或 `*/15`(私有),Healthchecks.io 盯夜间任务。总成本 $25-70/mo。"
        confidence: 9
        reference:
          - docs/7-decision-guide/en.md

      - id: internal-tool-pick
        question:
          en: "What monitor fits an internal tool not exposed to the public internet?"
          cn: "公网不可达的内部工具用哪个监控?"
        answer:
          en: "Self-hosted Uptime Kuma on a container you already operate. Pair with self-hosted Beszel on the same host for per-server resource monitoring. GH Actions cron at */30 is a sufficient second layer. Total cost: $0 + box cost. Hosted monitors (Better Stack, UptimeRobot) cannot see internal-only services."
          cn: "在已有的容器上自托管 Uptime Kuma。在同一台机器搭自托管 Beszel,加每服务器资源监控。GH Actions cron `*/30` 是充分的第二层。总成本 $0 + 机器成本。托管监控(Better Stack、UptimeRobot)看不到只有内网可达的服务。"
        confidence: 9
        reference:
          - docs/7-decision-guide/en.md

      - id: scheduled-jobs-pick
        question:
          en: "What monitor fits scheduled jobs (backups, ETL, periodic reports)?"
          cn: "定时任务(备份、ETL、周期报告)用哪个监控?"
        answer:
          en: "Healthchecks.io — open source, free for OSS projects, OSS-self-hostable on Postgres. Each job gets a UUID, pings /start, /, /fail. Pick Cronitor if you have a fleet of cron entries and want schedule-parsing + run-time metrics. If any job pushes to an HTTP endpoint you care about, add an HTTP monitor separately."
          cn: "Healthchecks.io —— 开源,开源项目免费,OSS 可在 Postgres 上自托管。每个任务一个 UUID,ping /start、/、/fail。如果你有一批 cron 条目,想要 schedule 解析 + 运行指标,选 Cronitor。如果任务会推到你在乎的 HTTP 端点,另外加 HTTP 监控。"
        confidence: 9
        reference:
          - docs/7-decision-guide/en.md

  - name:
      en: "defense in depth"
      cn: "纵深防御"
    qa:
      - id: why-two-tools
        question:
          en: "Why is \"two tools\" the floor?"
          cn: "为什么\"两个工具\"是底线?"
        answer:
          en: "Every primary monitor has a single point of failure it cannot itself catch: the monitor itself is down, or your account with the monitor lapses. The cheapest independent second layer is a GitHub Actions cron probing the primary monitor's status page URL, not your application URL. The status page going red on the GH side tells you the primary monitor is itself broken."
          cn: "每个主要监控都有一个自己抓不到的单点故障:监控本身挂了,或者你和监控的账户过期了。最便宜的独立第二层是 GitHub Actions cron 探测主要监控的状态页 URL,不是你的应用 URL。状态页在 GH 这边变红,说明主要监控本身坏了。"
        confidence: 9
        reference:
          - docs/7-decision-guide/en.md
          - docs/6-github-actions-as-monitor/en.md

      - id: probe-status-page-or-app
        question:
          en: "Should the second-layer GH Actions cron probe my application URL or the monitor's status page?"
          cn: "第二层 GH Actions cron 该探应用 URL 还是监控的状态页?"
        answer:
          en: "The monitor's status page. Probing your application URL means the GH cron is just a duplicate of your primary monitor. Probing the monitor's status page URL means the GH cron catches the case where the primary monitor is itself broken — which is the whole point of the second layer."
          cn: "监控的状态页。探应用 URL 等于 GH cron 只是主要监控的副本。探监控的状态页 URL 才是抓\"主要监控本身坏了\"的情况 —— 这才是第二层的意义。"
        confidence: 9
        reference:
          - docs/7-decision-guide/en.md

  - name:
      en: "costs"
      cn: "成本"
    qa:
      - id: cheapest-monitor-with-status-page
        question:
          en: "What's the cheapest monitor that ships a polished status page?"
          cn: "带打磨过的状态页的监控最便宜的是哪个?"
        answer:
          en: "Uptime Kuma self-hosted — free software, runs in a Docker container, ships a status page out of the box. Cost is the box you run it on (~$5/mo VPS). UptimeRobot's free tier includes a status page but it's UptimeRobot-branded; Better Stack's polished status page starts around $25/mo."
          cn: "Uptime Kuma 自托管 —— 软件免费,跑在 Docker 容器里,自带状态页。成本是跑它的那台机器(~$5/mo VPS)。UptimeRobot 免费档含一个状态页,但带 UptimeRobot 品牌;Better Stack 的打磨版状态页 $25/mo 起。"
        confidence: 9
        reference:
          - docs/7-decision-guide/en.md
